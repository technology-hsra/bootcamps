<!DOCTYPE html>
<html>
<head>
    <title>Kiosk Display</title>
    <style>
        body, html { 
            margin: 0; 
            padding: 0; 
            height: 100vh; 
            width: 100vw; 
            overflow: hidden; 
            background-color: white;
            /* This centers the iframe if it's smaller than the screen */
            display: flex;
            justify-content: center;
            align-items: center;
        }

        iframe { 
            width: 100%; 
            height: 100%; 
            border: none;
            /* OPTIONAL: Zoom. Change 1.0 to 1.2 to make it 20% bigger */
            transform: scale(1.0); 
            transform-origin: center;
        }
    </style>
    <script>
        // Auto-refresh every 5 minutes
        setTimeout(function(){
           location.reload();
        }, 300000); 
    </script>
</head>
<body>
    <iframe src="https://docs.google.com/spreadsheets/d/e/2PACX-1vSkuCgAc7eHk2IqOmsU2iZWsoacPryxR4EmYdKq5jL3tbPdXcQ6CWcndhIl5g6Z8_VpR-T91R1y964U/pubhtml?gid=569544912&single=true&rm=minimal&chrome=false"></iframe>
</body>
</html>
