<!DOCTYPE html>
<html>
<head>
    <title>Universal Kiosk Display</title>
<style>
    body, html { 
        margin: 0; 
        padding: 0; 
        height: 100vh; 
        width: 100vw; 
        overflow: hidden; 
        background-color: white;
    }

    .container {
        width: 100vw;
        height: 100vh;
        /* Remove flex centering to prevent the top from being pushed off-screen */
        overflow: hidden;
    }

    iframe { 
        width: 1920px; 
        height: 1080px; 
        border: none;

        /* Change origin to top center so Row 1 is the anchor point */
        transform: scale(calc(100vw / 1920));
        transform-origin: top center;
    }
</style>
    <script>
        // Refresh every 5 mins to sync staff changes
        setTimeout(function(){
           location.reload();
        }, 300000); 
    </script>
</head>
<body>
    <div class="container">
        <iframe src="https://docs.google.com/spreadsheets/d/e/2PACX-1vSkuCgAc7eHk2IqOmsU2iZWsoacPryxR4EmYdKq5jL3tbPdXcQ6CWcndhIl5g6Z8_VpR-T91R1y964U/pubhtml?gid=569544912&single=true&rm=minimal&chrome=false"></iframe>
    </div>
</body>
</html>
