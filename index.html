<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HSRA Kiosk Display</title>
    <style>
        /* Remove margins and hide scrollbars */
        body, html {
            margin: 0;
            padding: 0;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            background-color: #000; /* Black background for any letterboxing */
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Force image to fill screen while maintaining aspect ratio */
        img {
            width: 100vw;
            height: 100vh;
            object-fit: contain; /* Use 'fill' if you want to stretch it, 'contain' to keep it neat */
            display: block;
        }
    </style>
    
    <script>
        setTimeout(function(){
           location.reload();
        }, 600000); 
    </script>
</head>
<body>

    <img src="https://raw.githubusercontent.com/technology-hsra/bootcamps/refs/heads/main/maybootcamp.png" alt="May Bootcamp Schedule">

</body>
</html>
