<!DOCTYPE html>
<html>
<head>
    <title>Kiosk Display</title>
    <style>
        body, html { 
            margin: 0; 
            padding: 0; 
            height: 100vh; 
            width: 100vw; 
            overflow: hidden; 
            background-color: white;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* The Wrapper Container */
        .container {
            width: 100%;
            height: 100%;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        iframe { 
            /* Set the virtual size much larger (e.g., 150%) */
            width: 150%; 
            height: 150%; 
            border: none;
            
            /* Use zoom to scale the content itself */
            zoom: 1.5; 
            -moz-transform: scale(1.5); 
            -moz-transform-origin: 0 0;
            -o-transform: scale(1.5); 
            -o-transform-origin: 0 0;
            -webkit-transform: scale(1.5); 
            -webkit-transform-origin: 0 0;
        }
    </style>
    <script>
        // Auto-refresh every 5 minutes to catch Staff updates
        setTimeout(function(){
           location.reload();
        }, 300000); 
    </script>
</head>
<body>
    <div class="container">
        <iframe src="https://docs.google.com/spreadsheets/d/e/2PACX-1vSkuCgAc7eHk2IqOmsU2iZWsoacPryxR4EmYdKq5jL3tbPdXcQ6CWcndhIl5g6Z8_VpR-T91R1y964U/pubhtml?gid=569544912&single=true&rm=minimal&chrome=false"></iframe>
    </div>
</body>
</html>
