<!DOCTYPE html>
<html>
<head>
    <title>Universal Kiosk Display</title>
    <style>
        body, html { 
            margin: 0; 
            padding: 0; 
            height: 100vh; 
            width: 100vw; 
            overflow: hidden; 
            background-color: white;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        iframe { 
            /* This makes the 'window' of the sheet huge so it doesn't wrap */
            width: 1920px; 
            height: 1080px; 
            border: none;

            /* This scales the 1920px window to fit YOUR specific screen width */
            transform: scale(calc(100vw / 1920));
            transform-origin: center center;
        }

        /* If the screen is vertical or odd-shaped, this ensures it doesn't break */
        @media (aspect-ratio: 4/3) {
            iframe {
                transform: scale(calc(100vh / 1080));
            }
        }
    </style>
    <script>
        // Refresh every 5 mins to sync staff changes
        setTimeout(function(){
           location.reload();
        }, 300000); 
    </script>
</head>
<body>
    <div class="container">
        <iframe src="https://docs.google.com/spreadsheets/d/e/2PACX-1vSkuCgAc7eHk2IqOmsU2iZWsoacPryxR4EmYdKq5jL3tbPdXcQ6CWcndhIl5g6Z8_VpR-T91R1y964U/pubhtml?gid=569544912&single=true&rm=minimal&chrome=false"></iframe>
    </div>
</body>
</html>
