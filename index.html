<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>HSRA Kiosk Display</title>

  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background: #000;
    }

    .kiosk-container {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      position: relative;
      background: #000;
    }

    iframe {
      width: 100%;
      height: 106%;
      border: none;
      position: absolute;
      top: 0;
      left: 0;
    }
  </style>

  <script>
    // Reload the whole page every 10 minutes
    setInterval(function () {
      window.location.reload();
    }, 10 * 60 * 1000);
  </script>
</head>

<body>
  <div class="kiosk-container">
    <iframe
      src="https://www.canva.com/design/DAHLWOa-2OM/eWacgEcAAaUK40Ke5HTGjw/watch?embed&autoplay=1&loop=1"
      allow="autoplay; fullscreen"
      allowfullscreen
    ></iframe>
  </div>
</body>
</html>
