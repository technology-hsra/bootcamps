<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HSRA Kiosk Display</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            background-color: #000;
        }

        /* This container crops out the Canva player controls at the bottom */
        .kiosk-container {
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            position: relative;
        }

        /* Making the iframe 106% tall pushes the bottom player bar off the screen */
        iframe {
            width: 100%;
            height: 106%; 
            border: none;
            position: absolute;
            top: 0;
            left: 0;
        }
    </style>
    
    <script>
        // Keeps the page fresh and acts as a safety net backup loop
        setTimeout(function(){
           location.reload();
        }, 600000); 
    </script>
</head>
<body>

    <div class="kiosk-container">
        <iframe src="https://www.canva.com/design/DAHLWOa-2OM/eWacgEcAAaUK40Ke5HTGjw/watch?embed" allowfullscreen allow="autoplay"></iframe>
    </div>

</body>
</html>
